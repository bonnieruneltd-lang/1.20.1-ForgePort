# ------------------------------------------------------------------------------------------------
# Forge Talker - Gradle properties
#
# This file is the single source of truth for the Minecraft/Forge/mod versions used by the build.
# Any agent modifying target versions must edit this file (and docs/ARCHITECTURE.md section
# "Version matrix") so that the documentation and the build never drift apart.
# ------------------------------------------------------------------------------------------------

# Gradle JVM settings. The Minecraft decompiler used by ForgeGradle needs ~3 GB of heap.
# org.gradle.parallel is intentionally disabled: ForgeGradle's setup tasks are
# not safe to run concurrently on a memory constrained machine.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

## Environment / version matrix ---------------------------------------------------------------
# The Minecraft version must agree with the Forge version to get a valid artifact.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# Forge must agree with the Minecraft version. 47.x is the 1.20.1 line.
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod metadata -------------------------------------------------------------------------------
mod_id=forgetalker
mod_name=Forge Talker
mod_license=MIT
mod_version=1.0.0
mod_group_id=dev.forgetalker
mod_authors=Bonnier United Ltd
mod_description=Forge Talker bridges unmodified Forge 1.20.1 mods onto a distributed MultiPaper cluster. It tracks chunk/entity ownership per node, relays modded network payloads between nodes and re-broadcasts Forge server events on the cluster event bus.
